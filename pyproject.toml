[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cafe", "cafe.*", "cafe_api", "cafe_api.*"]

[project]
name = "cafe-api"
version = "0.1.0"
description = "A small Django REST API for cafe listings."
requires-python = ">=3.12"
dependencies = [
    "Django==6.0.5",
    "django-filter==25.2",
    "djangorestframework==3.17.1",
    "Markdown==3.10.2",
    "python-dotenv>=1.2.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "django-stubs==6.0.4",
    "django-stubs-ext==6.0.4",
    "djangorestframework-stubs==3.16.9",
    "types-PyYAML==6.0.12.20260510",
]

[tool.django-stubs]
django_settings_module = "cafe_api.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cafe_api.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["cafe"]
